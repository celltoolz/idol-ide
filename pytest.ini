[pytest]
testpaths = tests

# IDOL is a flat package-less layout imported as `app`, `widgets.x`, `utils.y`.
# `pythonpath = .` puts the repo root on sys.path so tests import the real
# modules rather than needing an installed distribution.
pythonpath = .

addopts = -q --strict-markers

markers =
    gui: requires a real Tk display (skipped automatically when none is available)

filterwarnings =
    # tkfontchooser calls locale.getdefaultlocale() at import time. Third-party,
    # not actionable here, and it is queued for replacement (see TODO.md).
    # Silenced so it cannot bury a warning that *is* ours.
    ignore:'locale.getdefaultlocale' is deprecated:DeprecationWarning
