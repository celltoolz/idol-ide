[pytest]
testpaths = tests

# IDOL is a flat package-less layout imported as `app`, `widgets.x`, `utils.y`.
# `pythonpath = .` puts the repo root on sys.path so tests import the real
# modules rather than needing an installed distribution.
pythonpath = .

addopts = -q --strict-markers

markers =
    gui: requires a real Tk display (skipped automatically when none is available)

# The `locale.getdefaultlocale` DeprecationWarning filter that lived here was
# only ever needed for tkfontchooser's import. That dependency is gone
# (widgets/font_chooser.py replaced it), so the filter went with it rather than
# sitting around silencing a warning nothing raises.
